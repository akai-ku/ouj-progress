
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>放送大学 学習進捗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #212127;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0eff2;
    --muted: #7a7a8a;
    --green: #3ecf8e;
    --green-dim: rgba(62,207,142,0.15);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.15);
    --blue: #5b8dee;
    --accent: #3ecf8e;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(15,15,17,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--green);
    letter-spacing: 0.05em;
  }
  .logo span { color: var(--muted); }
  .add-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 16px;
    background: var(--green);
    color: #0f1a14;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .add-btn:hover { opacity: 0.85; }

  /* MAIN */
  main { max-width: 820px; margin: 0 auto; padding: 2rem 1rem 4rem; }

  /* SUMMARY */
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 2rem;
  }
  .sum-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    text-align: center;
  }
  .sum-num {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
  }
  .sum-num.green { color: var(--green); }
  .sum-sub { font-size: 14px; color: var(--muted); }
  .sum-lbl { font-size: 11px; color: var(--muted); }

  /* SUBJECT CARD */
  .subject-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .subject-card:hover { border-color: var(--border2); }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .subject-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    border: none;
    background: none;
    font-family: 'Noto Sans JP', sans-serif;
    outline: none;
    max-width: 260px;
  }
  .subject-name:focus {
    border-bottom: 1px solid var(--green);
    color: var(--text);
  }
  .card-right { display: flex; align-items: center; gap: 10px; }
  .pct-badge {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--green);
    background: var(--green-dim);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .del-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 16px; line-height: 1;
    padding: 2px 4px; border-radius: 4px;
    transition: color 0.15s;
  }
  .del-btn:hover { color: #e55; }

  /* PROGRESS BAR */
  .prog-bar {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, #5beed8 100%);
    border-radius: 2px;
    transition: width 0.35s ease;
  }

  /* SECTIONS */
  .section-row { margin-bottom: 12px; }
  .sec-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* LECTURE BUTTONS */
  .lec-grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .lec {
    width: 34px; height: 34px;
    border-radius: 7px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    font-weight: 500;
  }
  .lec:hover { border-color: var(--green); color: var(--green); }
  .lec.done {
    background: var(--green-dim);
    border-color: var(--green);
    color: var(--green);
  }

  /* TASK TOGGLES（通信指導・単位認定試験） */
  .task-row { display: flex; gap: 6px; }
  .task {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .task:hover { border-color: var(--green); color: var(--text); }
  .task-check {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px;
    line-height: 1;
    color: transparent;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .task.done {
    background: var(--green-dim);
    border-color: var(--green);
    color: var(--green);
  }
  .task.done .task-check {
    background: var(--green);
    border-color: var(--green);
    color: #0f1a14;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.75rem;
    width: 90%;
    max-width: 380px;
    animation: fadeUp 0.2s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .modal h3 { font-size: 15px; font-weight: 500; margin-bottom: 1rem; }
  .modal input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .modal input:focus { border-color: var(--green); }
  .modal-label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .modal input[type="number"] {
    font-family: 'DM Mono', monospace;
  }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btns button {
    padding: 8px 18px;
    border-radius: var(--radius-sm);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border2);
    background: none;
    color: var(--muted);
    transition: all 0.15s;
  }
  .modal-btns .primary {
    background: var(--green);
    color: #0f1a14;
    border-color: var(--green);
    font-weight: 700;
  }
  .modal-btns button:hover { opacity: 0.8; }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }
  .empty .emoji { font-size: 32px; margin-bottom: 12px; }

  @media (max-width: 480px) {
    .summary { grid-template-columns: repeat(3,1fr); }
    .sum-num { font-size: 22px; }
    .subject-name { font-size: 14px; max-width: 180px; }
  }
</style>
</head>















<body>

<header>
  <div class="logo">hoso<span>.track</span></div>
  <div style="display: flex; gap: 8px;">
    <button class="add-btn" id="exportBtn" style="background: var(--surface2); color: var(--text); border: 1px solid var(--border2);">📤 保存</button>
    <button class="add-btn" id="openModal">＋ 科目を追加</button>
  </div>
</header>

<main>
  <div class="summary" id="summary"></div>
  <div id="subjectList"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>科目を追加</h3>
    <input type="text" id="subjectInput" placeholder="科目名（例：日本語概説）" maxlength="30" />
    <label class="modal-label" for="lecCountInput">授業数（1〜50）</label>
    <input type="number" id="lecCountInput" min="1" max="50" value="15" />
    <div class="modal-btns">
      <button id="cancelModal">キャンセル</button>
      <button class="primary" id="confirmModal">追加する</button>
    </div>
  </div>
</div>









<script>
const KEY = 'hoso_v3';
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwIVzt1AAvyTH4yqEwYixjDbYPF7eOVnvh810umc6vamIufFSVTJrQh4avTl2l5fBG4/exec'; 


  

// --- データ処理 ---
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save(data) {
  localStorage.setItem(KEY, JSON.stringify(data));
}

// スプレッドシート等から来たデータを安全な形に整える
function normalize(list) {
  if (!Array.isArray(list)) return [];
  return list.map(s => {
    let lecs = s && s.lectures;
    if (typeof lecs === 'string') {
      try { lecs = JSON.parse(lecs); } catch { lecs = lecs.split(','); }
    }
    if (!Array.isArray(lecs)) lecs = [];
    const count = Math.min(Math.max(lecs.length || 15, 1), 50);
    lecs = Array.from({ length: count }, (_, i) =>
      lecs[i] === true || lecs[i] === 'true' || lecs[i] === 'TRUE' || lecs[i] === 1
    );
    return {
      id: String((s && s.id) || crypto.randomUUID()),
      name: String((s && s.name) || '無題の科目'),
      lectures: lecs,
      tsushin: (s && s.tsushin) === 'done' ? 'done' : 'none',
      unit: (s && s.unit) === 'done' ? 'done' : 'none'
    };
  });
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

let subjects = normalize(load());

function pct(s) {
  const done = s.lectures.filter(Boolean).length
    + (s.tsushin === 'done' ? 1 : 0)
    + (s.unit === 'done' ? 1 : 0);
  return Math.round(done / (s.lectures.length + 2) * 100);
}

// --- 描画処理 ---
function renderSummary() {
  const total = subjects.length;
  const completed = subjects.filter(s => pct(s) === 100).length;
  const lecsDone = subjects.reduce((a, s) => a + s.lectures.filter(Boolean).length, 0);
  const lecsTotal = subjects.reduce((a, s) => a + s.lectures.length, 0);
  document.getElementById('summary').innerHTML = `
    <div class="sum-card">
      <div class="sum-num">${total}</div>
      <div class="sum-lbl">登録科目</div>
    </div>
    <div class="sum-card">
      <div class="sum-num green">${completed}</div>
      <div class="sum-lbl">修了済み</div>
    </div>
    <div class="sum-card">
      <div class="sum-num">${lecsDone}<span class="sum-sub">/${lecsTotal}</span></div>
      <div class="sum-lbl">視聴済み回数</div>
    </div>
  `;
}

function renderSubjects() {
  const list = document.getElementById('subjectList');
  if (!subjects.length) {
    list.innerHTML = `<div class="empty"><div class="emoji">📚</div>まだ科目が登録されていません。<br>「＋ 科目を追加」から始めましょう。</div>`;
    return;
  }
  list.innerHTML = '';
  subjects.forEach(s => {
    const p = pct(s);
    const card = document.createElement('div');
    card.className = 'subject-card';

    const lecs = s.lectures.map((done, i) =>
      `<button class="lec ${done ? 'done' : ''}" data-id="${s.id}" data-i="${i}">${String(i+1).padStart(2,'0')}</button>`
    ).join('');

    const taskH = (f, label) =>
      `<button class="task ${s[f]==='done' ? 'done' : ''}" data-id="${s.id}" data-f="${f}">
        <span class="task-check">✓</span>${label}${s[f]==='done' ? '済み' : ''}
      </button>`;

    card.innerHTML = `
      <div class="card-header">
        <input class="subject-name" value="${esc(s.name)}" data-id="${s.id}" />
        <div class="card-right">
          <span class="pct-badge">${p}%</span>
          <button class="del-btn" data-del="${s.id}">×</button>
        </div>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${p}%"></div></div>
      <div class="section-row">
        <div class="sec-label">授業 — 全${s.lectures.length}回</div>
        <div class="lec-grid">${lecs}</div>
      </div>
      <div class="section-row">
        <div class="sec-label">提出・試験</div>
        <div class="task-row">${taskH('tsushin','通信指導 提出')}${taskH('unit','単位認定試験 受験')}</div>
      </div>
    `;
    list.appendChild(card);
  });

  // イベント登録（カード内）
  list.querySelectorAll('.lec').forEach(b => b.addEventListener('click', () => {
    const s = subjects.find(x => x.id === b.dataset.id);
    s.lectures[+b.dataset.i] = !s.lectures[+b.dataset.i];
    save(subjects); render();
  }));
  list.querySelectorAll('.task').forEach(b => b.addEventListener('click', () => {
    const s = subjects.find(x => x.id === b.dataset.id);
    s[b.dataset.f] = s[b.dataset.f] === 'done' ? 'none' : 'done';
    save(subjects); render();
  }));
  list.querySelectorAll('.del-btn').forEach(b => b.addEventListener('click', () => {
    if (confirm('この科目を削除しますか？')) {
      subjects = subjects.filter(x => x.id !== b.dataset.del);
      save(subjects); render();
    }
  }));
  list.querySelectorAll('.subject-name').forEach(inp => inp.addEventListener('change', () => {
    const s = subjects.find(x => x.id === inp.dataset.id);
    s.name = inp.value.trim() || s.name;
    save(subjects); render();
  }));
}

function render() { 
  renderSummary(); 
  renderSubjects(); 
}

window.addEventListener('DOMContentLoaded', async () => {
  // --- 追記：起動時にスプレッドシートから読み込む ---
  try {
    const response = await fetch(ENDPOINT, { method: 'GET' });
    if (response.ok) {
      const remoteData = normalize(await response.json());
      if (remoteData.length > 0) {
        subjects = remoteData;
        save(subjects); // ローカルにも保存
      }
    }
  } catch (e) {
    console.log("スプレッドシートからの読み込みに失敗しました（ローカルデータを使用します）", e);
  }
  // --------------------------------------------


  render();

  // 1. 保存ボタンの設定
  const exportBtn = document.getElementById('exportBtn');
  if (exportBtn) {
    exportBtn.addEventListener('click', async () => {
      if (subjects.length === 0) return alert('保存するデータがありません。');
      try {
        exportBtn.innerText = '保存中...';
        exportBtn.style.opacity = '0.5';
        await fetch(ENDPOINT, {
          method: 'POST',
          mode: 'no-cors', 
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(subjects)
        });
        alert('送信リクエストを完了しました！');
      } catch (e) {
        alert('エラーが発生しました。');
      } finally {
        exportBtn.innerText = '📤 保存';
        exportBtn.style.opacity = '1';
      }
    });
  }

  // 2. モーダル処理の設定
  const overlay = document.getElementById('modalOverlay');
  const input = document.getElementById('subjectInput');
  const countInput = document.getElementById('lecCountInput');
  const openBtn = document.getElementById('openModal');
  const cancelBtn = document.getElementById('cancelModal');
  const confirmBtn = document.getElementById('confirmModal');

  if (openBtn) {
    openBtn.addEventListener('click', () => {
      overlay.classList.add('open');
      input.value = '';
      countInput.value = '15';
      input.focus();
    });
  }
  if (cancelBtn) {
    cancelBtn.addEventListener('click', () => overlay.classList.remove('open'));
  }
  if (overlay) {
    overlay.addEventListener('click', e => { 
      if (e.target === overlay) overlay.classList.remove('open'); 
    });
  }

  function addSubject() {
    const name = input.value.trim();
    if (!name) return;
    const count = Math.min(Math.max(parseInt(countInput.value, 10) || 15, 1), 50);
    subjects.push({
      id: crypto.randomUUID(),
      name,
      lectures: Array(count).fill(false),
      tsushin: 'none',
      unit: 'none'
    });
    save(subjects); 
    render();
    overlay.classList.remove('open');
  }

  if (confirmBtn) confirmBtn.addEventListener('click', addSubject);
  if (input) {
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addSubject(); });
  }
  if (countInput) {
    countInput.addEventListener('keydown', e => { if (e.key === 'Enter') addSubject(); });
  }
});
</script>
</body>
</html>
